
<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      // Fix for read-only window.fetch in some iframe / proxy environments
      try {
        let originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get() {
            return originalFetch;
          },
          set(value) {
            originalFetch = value;
          },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        console.warn("Could not patch window.fetch setter:", e);
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ZenterPrime - Early Access</title>
    <meta name="description" content="Simple cloud-synced purchase and stock management system." />
    <meta name="theme-color" content="#4338CA" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('[PWA] ServiceWorker registered with scope:', reg.scope);
            reg.update();
          }).catch((err) => {
            console.warn('[PWA] ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
    
    <!-- Google Fonts: Ubuntu -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">

    <style>
      :root {
        --color-primary: #4338CA;
        --color-primary-dark: #3730A3;
        --color-primary-light: #e0e7ff;
      }
    </style>
    <script>
      (function() {
        try {
          var isDark = localStorage.getItem('app_theme') === 'dark';

          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }

          document.documentElement.style.setProperty('--color-primary', '#4338CA');
          document.documentElement.style.setProperty('--color-primary-dark', '#3730A3');
          document.documentElement.style.setProperty('--color-primary-light', '#e0e7ff');
        } catch(e) {}
      })();
    </script>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2215%22 fill=%22%234338ca%22/><text x=%2250%%22 y=%2252%%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22 fill=%22%23ffffff%22 style=%22font-size:52px;font-weight:800;font-family:sans-serif%22>Z</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Ubuntu', 'sans-serif'],
              mono: ['Ubuntu', 'sans-serif'],
              serif: ['Ubuntu', 'sans-serif'],
            },
            fontSize: {
              'xs': ['13px', '18px'],
              'sm': ['14px', '20px'],
              'base': ['15px', '22px'],
            },
            colors: {
              primary: {
                DEFAULT: 'var(--color-primary, #4338CA)',
                dark: 'var(--color-primary-dark, #3730A3)',
                light: 'var(--color-primary-light, #e0e7ff)'
              },
              link: '#2563EB',
              slate: {
                50: '#f9f9f9',
                100: '#F1F5F9',
                200: '#E2E8F0',
                300: '#CBD5E1',
                400: '#94A3B8',
                500: '#64748B',
                600: '#475569',
                700: '#334155',
                800: '#1E293B',
                900: '#0F172A',
                950: '#020617',
              }
            },
            borderRadius: {
              'none': '0',
              'sm': '1px',
              'md': '2px',
              'lg': '4px',
              'xl': '6px'
            }
          }
        }
      }
    </script>

    <!-- Theme initialized above -->

    <style>
      body { 
        font-family: 'Ubuntu', sans-serif !important; 
        background-color: #F7F8FC;
        color: #111827;
        font-size: 13.5px !important;
        -webkit-font-smoothing: antialiased;
      }
      .dark body {
        background-color: #020617;
        color: #f1f5f9;
      }
      *, ::before, ::after {
        font-family: 'Ubuntu', sans-serif !important;
        animation-duration: 0.001ms !important;
        animation-delay: 0s !important;
        transition-duration: 0.001ms !important;
        transition-delay: 0s !important;
      }
      /* Allow spinner to spin during async operations */
      .animate-spin {
        animation: spin 1s linear infinite !important;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      button, input, select, textarea, h1, h2, h3, h4, h5, h6, p, span, div, td, th, pre, code, label, .font-mono, .font-sans, .font-serif {
        font-family: 'Ubuntu', sans-serif !important;
      }

      /* Convert extra bold font styles to medium font weight */
      .font-extrabold, .font-black {
        font-weight: 500 !important;
      }

      /* Liquid Glass Header styling for form headers, modals, and sticky top sections */
      .liquid-glass-header {
        background: rgba(255, 255, 255, 0.75) !important;
        -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
        backdrop-filter: blur(16px) saturate(180%) !important;
        border-bottom: 1px solid rgba(226, 232, 240, 0.8) !important;
        box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.04), inset 0 1px 0 0 rgba(255, 255, 255, 0.7) !important;
      }

      .dark .liquid-glass-header {
        background: rgba(15, 23, 42, 0.75) !important;
        -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
        backdrop-filter: blur(16px) saturate(180%) !important;
        border-bottom: 1px solid rgba(30, 41, 59, 0.8) !important;
        box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.35), inset 0 1px 0 0 rgba(255, 255, 255, 0.08) !important;
      }

      /* Liquid Glass Box for inner sticky form action bars */
      .liquid-glass-box {
        background: rgba(255, 255, 255, 0.75) !important;
        -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
        backdrop-filter: blur(16px) saturate(180%) !important;
        border: 1px solid rgba(226, 232, 240, 0.9) !important;
        box-shadow: 0 8px 32px -4px rgba(0, 0, 0, 0.06), inset 0 1px 0 0 rgba(255, 255, 255, 0.8) !important;
      }

      .dark .liquid-glass-box {
        background: rgba(15, 23, 42, 0.75) !important;
        -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
        backdrop-filter: blur(16px) saturate(180%) !important;
        border: 1px solid rgba(30, 41, 59, 0.9) !important;
        box-shadow: 0 8px 32px -4px rgba(0, 0, 0, 0.4), inset 0 1px 0 0 rgba(255, 255, 255, 0.1) !important;
      }

      /* Global Minimum Font Size Rule: Enforce at least 13px - 14px */
      .text-\[10px\], .text-\[11px\], .text-\[12px\], .text-xs,
      [class*="text-[10px]"], [class*="text-[11px]"], [class*="text-[12px]"], [class*="text-[9pt]"] {
        font-size: 13px !important;
      }
      
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #CBD5E1;
        border-radius: 10px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #334155;
      }
      
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      .clean-table {
        width: 100%;
        border-collapse: collapse;
        background: white;
      }
      .dark .clean-table {
        background: #0F172A;
      }
      .clean-table th {
        background-color: #F8FAFC;
        color: #64748b;
        font-weight: 700;
        font-size: 11px !important;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 14px 24px;
        border: none;
        border-bottom: 1px solid #e2e8f0;
        text-align: left;
      }
      .dark .clean-table th {
        background-color: rgba(30, 41, 59, 0.6);
        color: #94a3b8;
        border-color: #1e293b;
      }
      .clean-table td {
        padding: 16px 24px;
        border: none;
        border-bottom: 1px solid #f1f5f9;
        color: #334155;
        font-size: 14px !important;
      }
      .dark .clean-table td {
        border-color: #1e293b;
        color: #cbd5e1;
      }
      .clean-table tr:hover td {
        background-color: rgba(248, 250, 252, 0.8);
      }
      .dark .clean-table tr:hover td {
        background-color: rgba(30, 41, 59, 0.4);
      }

      input, select, textarea {
        border-radius: 2px !important;
        font-size: 13.5px !important;
      }

      /* Selector Yellow for Table Columns & Selection */
      .selector-yellow,
      .table-column-selector,
      table th.selector-col,
      table td.selector-col {
        background-color: #FEF3C7 !important;
        color: #78350F !important;
        border-color: #FCD34D !important;
      }
      .dark .selector-yellow,
      .dark .table-column-selector,
      .dark table th.selector-col,
      .dark table td.selector-col {
        background-color: rgba(120, 53, 15, 0.35) !important;
        color: #FDE68A !important;
        border-color: rgba(245, 158, 11, 0.4) !important;
      }
      .table-row-selected {
        background-color: #FEF9C3 !important;
        color: #78350F !important;
      }
      .dark .table-row-selected {
        background-color: rgba(120, 53, 15, 0.3) !important;
        color: #FDE68A !important;
      }

      @media print {
        @page {
          size: A4 portrait;
          margin: 1cm;
        }
        header, aside, .print\:hidden, nav, button {
          display: none !important;
        }
        main {
          padding: 0 !important;
          margin: 0 !important;
          width: 100% !important;
        }
        .clean-table {
          font-size: 11pt !important;
          border: 1px solid #000 !important;
        }
        .clean-table td, .clean-table th {
          border: 1px solid #000 !important;
          font-size: 11pt !important;
        }
      }
    </style>
</head>
  <body class="dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
